<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RESONA · handpan</title>
    <meta
      name="description"
      content="RESONA virtual handpan — browser instrument by Sepzok."
    />
    <link rel="icon" href="./favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --ink: #101418;
        --muted: #5b6575;
        --accent: #1d4f91;
        --line: #d7dee8;
        --soft: #f3f6fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(800px 420px at 10% -10%, #d7e6f8, transparent 55%),
          linear-gradient(180deg, #f8fafc, #eef2f7);
      }
      .wrap {
        width: min(920px, calc(100% - 40px));
        margin: 0 auto;
        padding: 48px 0 64px;
      }
      .brand {
        font-weight: 700;
        letter-spacing: -0.02em;
        font-size: 14px;
        color: var(--muted);
        margin: 0 0 28px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 6vw, 3.4rem);
        letter-spacing: -0.035em;
        line-height: 1.08;
      }
      .lede {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1.15rem;
        max-width: 36ch;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 36px;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
      }
      .primary {
        background: var(--accent);
        color: #fff;
      }
      .ghost {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 16px 40px rgba(16, 28, 48, 0.06);
      }
      .panel h2 {
        margin: 0 0 10px;
        font-size: 1.15rem;
      }
      .panel p,
      .panel li {
        color: var(--muted);
        margin: 0 0 0.7rem;
      }
      .panel ul {
        margin: 0;
        padding-left: 1.2rem;
      }
      .note {
        margin-top: 18px;
        font-size: 0.92rem;
        color: var(--muted);
      }
      code {
        background: var(--soft);
        padding: 0.1em 0.35em;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="brand">Sepzok · open source</p>
      <h1>RESONA Virtual Handpan</h1>
      <p class="lede">
        浏览器里的虚拟手碟：多指触控、力度与 Web Audio 低延迟演奏。
      </p>
      <div class="actions">
        <a class="btn primary" href="https://github.com/Sepzok/handpan"
          >View on GitHub</a
        >
        <a
          class="btn ghost"
          href="https://github.com/Sepzok/handpan#快速开始"
          >Run locally</a
        >
      </div>
      <div class="panel">
        <h2>本页说明</h2>
        <p>
          完整演奏应用依赖本机构建（Vinext / Sites）。GitHub Pages
          提供项目介绍页；本地运行：
        </p>
        <ul>
          <li><code>npm ci</code></li>
          <li><code>npm run dev</code></li>
        </ul>
        <p class="note">
          源码仓库：
          <a href="https://github.com/Sepzok/handpan">github.com/Sepzok/handpan</a>
        </p>
      </div>
    </div>
  </body>
</html>
